<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande — AZ Store</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="AZ Store" class="logo">
      <span class="brand-name">AZ<span>Store</span></span>
    </a>
    <nav class="nav-links" style="margin-left:auto;">
      <a href="index.html" data-i18n="navShop">Boutique</a>
      <select id="currencySelect" class="select-mini" aria-label="Devise">
        <option value="eur">EUR €</option>
        <option value="usd">USD $</option>
        <option value="dt">DT</option>
        <option value="sar">SAR</option>
      </select>
      <select id="langSelect" class="select-mini" aria-label="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
      <span id="navAuthSlot"></span>
    </nav>

    <button class="icon-btn nav-toggle" id="mobileNavToggle" aria-label="Menu" title="Menu" style="margin-left:auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="nav-links-mobile" id="navLinksMobile">
    <a href="index.html" data-i18n="navShop">Boutique</a>
    <a href="login.html" data-i18n="navLogin">Se connecter</a>
    <select id="currencySelectMobile" class="select-mini" aria-label="Devise" style="margin-top:8px;">
      <option value="eur">EUR €</option>
      <option value="usd">USD $</option>
      <option value="dt">DT</option>
      <option value="sar">SAR</option>
    </select>
    <select id="langSelectMobile" class="select-mini" aria-label="Langue" style="margin-top:8px;">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="ar">AR</option>
    </select>
  </div>
</header>

<div class="breadcrumb">
  <a href="index.html" data-i18n="breadcrumbShop">Boutique</a>
  <span>/</span>
  <span data-i18n="checkoutCartTitle">Commande</span>
</div>

<div class="checkout-wrap">
  <div>
    <!-- Articles -->
    <div class="checkout-section">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
        <span data-i18n="checkoutCartTitle">Ton panier</span>
      </h3>
      <div id="checkoutItems"></div>
    </div>

    <!-- Coordonnées -->
    <div class="checkout-section">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        <span data-i18n="contactSectionTitle">Tes coordonnées</span>
      </h3>
      <div class="field">
        <label for="contactPseudo" data-i18n="pseudoLabel">Pseudo Roblox</label>
        <input type="text" id="contactPseudo" required placeholder="TonPseudoRoblox">
      </div>
      <div class="field">
        <label for="contactWhatsappDiscord" data-i18n="whatsappDiscordLabel">Numéro WhatsApp ou pseudo Discord</label>
        <input type="text" id="contactWhatsappDiscord" required placeholder="+216 XX XXX XXX ou TonPseudo#0000">
      </div>
    </div>

    <!-- Pays + Paiement -->
    <div class="checkout-section">
      <h3>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span data-i18n="paymentTitle">Pays &amp; méthode de paiement</span>
      </h3>
      <div class="field">
        <label for="countrySelect" data-i18n="countryLabel">Pays</label>
        <select id="countrySelect">
          <option value="tn" data-i18n="tunisia">Tunisie</option>
          <option value="other" data-i18n="otherCountry">Autre pays</option>
        </select>
      </div>
      <div class="payment-options" id="paymentOptions">
        <!-- généré dynamiquement par js selon le pays choisi -->
      </div>

      <!-- Adresse postale, affichée uniquement si "Par poste" est choisi -->
      <div class="field" id="postAddressField" style="display:none; margin-top:14px;">
        <label for="postAddress" data-i18n="postAddressLabel">Adresse postale complète (livraison)</label>
        <textarea id="postAddress" placeholder="Nom, rue, ville, code postal, gouvernorat..."></textarea>
      </div>
    </div>
  </div>

  <!-- Résumé -->
  <div class="summary-box">
    <h3 style="margin-bottom:16px;" data-i18n="summaryTitle">Résumé</h3>
    <div class="summary-item"><span data-i18n="subtotal">Sous-total</span><span id="sumSubtotal">0.00 €</span></div>
    <div class="summary-item"><span data-i18n="fees">Frais</span><span>0.00 €</span></div>
    <div class="summary-divider"></div>
    <div class="summary-total"><span data-i18n="total">Total</span><span class="amount" id="sumTotal">0.00 €</span></div>
    <div class="form-msg" id="checkoutMsg"></div>
    <button class="btn btn-primary btn-block" id="confirmOrderBtn" data-i18n="confirmOrder">Confirmer la commande</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/currency.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  // Méthodes de paiement disponibles selon le pays
  function getPaymentMethods(country) {
    const lang = I18n.get();
    const robuxLabel = { fr: "Échange Robux", en: "Robux exchange", ar: "تبادل Robux" }[lang];
    const robuxSub = {
      fr: "Paiement via échange d'objets/Robux en jeu",
      en: "Payment via in-game item/Robux exchange",
      ar: "الدفع عبر تبادل الأغراض/الروبوكس داخل اللعبة"
    }[lang];
    const posteLabel = { fr: "Paiement à la livraison — La Poste", en: "Cash on delivery — Post office", ar: "الدفع عند الاستلام — البريد" }[lang];
    const posteSub = {
      fr: "Tu payes en espèces à la réception via La Poste Tunisienne",
      en: "Pay in cash on delivery via Tunisian Post",
      ar: "تدفع نقداً عند الاستلام عبر البريد التونسي"
    }[lang];
    const ooredooLabel = { fr: "Recharge Ooredoo", en: "Ooredoo credit", ar: "رصيد اوريدو" }[lang];
    const ooredooSub = {
      fr: "Paiement via transfert de recharge/crédit Ooredoo",
      en: "Payment via Ooredoo credit transfer",
      ar: "الدفع عبر تحويل رصيد اوريدو"
    }[lang];

    const robux = {
      value: "robux", title: robuxLabel, sub: robuxSub,
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M12 2 2 8.5 12 15l10-6.5L12 2Z"/><path d="M2 15.5 12 22l10-6.5"/><path d="M2 12l10 6.5L22 12"/></svg>`
    };
    const poste = {
      value: "poste", title: posteLabel, sub: posteSub,
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 6 10 7L22 6"/></svg>`
    };
    const ooredoo = {
      value: "ooredoo", title: ooredooLabel, sub: ooredooSub,
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M9 18h.01"/><path d="M16 9v6l4 2V7l-4 2Z"/></svg>`
    };

    return country === "tn" ? [robux, poste, ooredoo] : [robux];
  }

  function renderPaymentOptions(country) {
    const wrap = document.getElementById("paymentOptions");
    const methods = getPaymentMethods(country);

    wrap.innerHTML = methods.map((m, i) => `
      <label class="payment-option ${i === 0 ? "selected" : ""}" data-value="${m.value}">
        <input type="radio" name="payment" value="${m.value}" ${i === 0 ? "checked" : ""}>
        ${m.icon}
        <div class="po-info">
          <div class="po-title">${m.title}</div>
          <div class="po-sub">${m.sub}</div>
        </div>
      </label>
    `).join("");

    wrap.querySelectorAll(".payment-option").forEach(opt => {
      opt.addEventListener("click", () => {
        wrap.querySelectorAll(".payment-option").forEach(o => o.classList.remove("selected"));
        opt.classList.add("selected");
        opt.querySelector("input").checked = true;
        togglePostAddress();
      });
    });
    togglePostAddress();
  }

  function togglePostAddress() {
    const selected = document.querySelector('input[name="payment"]:checked')?.value;
    const field = document.getElementById("postAddressField");
    const input = document.getElementById("postAddress");
    if (selected === "poste") {
      field.style.display = "block";
      input.required = true;
    } else {
      field.style.display = "none";
      input.required = false;
    }
  }

  document.getElementById("countrySelect").addEventListener("change", (e) => {
    renderPaymentOptions(e.target.value);
  });
  renderPaymentOptions("tn");
  document.addEventListener("langchange", () => {
    renderPaymentOptions(document.getElementById("countrySelect").value);
  });

  function renderCheckoutItems() {
    const items = Cart.getAll();
    const wrap = document.getElementById("checkoutItems");
    if (items.length === 0) {
      wrap.innerHTML = `<p>${I18n.t("emptyCart")} <a href="index.html" style="color:var(--green-neon)">${I18n.t("breadcrumbShop")}</a></p>`;
      document.getElementById("confirmOrderBtn").disabled = true;
      return;
    }
    document.getElementById("confirmOrderBtn").disabled = false;
    wrap.innerHTML = items.map(i => `
      <div class="cart-item">
        <div class="cart-item-visual ${i.img_class || 'grad-green'}">${getIcon(i.icon)}</div>
        <div class="cart-item-info">
          <div class="title">${escapeHtml(i.title)}</div>
          <div class="price">${formatPrice(i.price)} &times; ${i.qty}</div>
        </div>
      </div>
    `).join("");

    const total = Cart.total();
    document.getElementById("sumSubtotal").textContent = formatPrice(total);
    document.getElementById("sumTotal").textContent = formatPrice(total);
  }

  document.getElementById("confirmOrderBtn").addEventListener("click", async () => {
    const msg = document.getElementById("checkoutMsg");
    msg.className = "form-msg";
    const lang = I18n.get();

    const pseudo = document.getElementById("contactPseudo").value.trim();
    const whatsappDiscord = document.getElementById("contactWhatsappDiscord").value.trim();
    const country = document.getElementById("countrySelect").value;
    const payment = document.querySelector('input[name="payment"]:checked')?.value;
    const postAddress = document.getElementById("postAddress").value.trim();
    const items = Cart.getAll();

    const msgs = {
      fillAll: { fr: "Merci de remplir tous les champs.", en: "Please fill in all fields.", ar: "يرجى ملء جميع الحقول." },
      needAddress: { fr: "Merci de renseigner ton adresse postale pour la livraison via La Poste.", en: "Please provide your postal address for delivery via the Post office.", ar: "يرجى إدخال عنوانك البريدي للتسليم عبر البريد." },
      emptyCart: { fr: "Ton panier est vide.", en: "Your cart is empty.", ar: "سلتك فارغة." },
      confirming: { fr: "Confirmation...", en: "Confirming...", ar: "جارٍ التأكيد..." },
      success: { fr: "Commande enregistrée ! Nous te contactons rapidement.", en: "Order saved! We'll contact you shortly.", ar: "تم تسجيل الطلب! سنتواصل معك قريباً." },
      error: { fr: "Une erreur est survenue. Réessaie ou contacte-nous sur WhatsApp.", en: "An error occurred. Try again or contact us on WhatsApp.", ar: "حدث خطأ. أعد المحاولة أو تواصل معنا عبر واتساب." }
    };

    if (!pseudo || !whatsappDiscord) {
      msg.textContent = msgs.fillAll[lang];
      msg.classList.add("show", "error");
      return;
    }
    if (payment === "poste" && !postAddress) {
      msg.textContent = msgs.needAddress[lang];
      msg.classList.add("show", "error");
      return;
    }
    if (items.length === 0) {
      msg.textContent = msgs.emptyCart[lang];
      msg.classList.add("show", "error");
      return;
    }

    const btn = document.getElementById("confirmOrderBtn");
    btn.disabled = true;
    btn.textContent = msgs.confirming[lang];

    try {
      const countryLabel = I18n.t(country === "tn" ? "tunisia" : "otherCountry");
      const contactParts = [`${pseudo} (${whatsappDiscord})`, `${I18n.t("countryLabel")}: ${countryLabel}`];
      if (payment === "poste" && postAddress) contactParts.push(`${I18n.t("postAddressLabel")}: ${postAddress}`);
      const contactStr = contactParts.join(" — ");

      const user = await Auth.getUser();
      const rows = items.map(i => ({
        user_id: user ? user.id : null,
        product_id: i.id,
        product_title: i.title,
        amount: i.price * i.qty,
        status: "pending",
        payment_method: payment,
        contact: contactStr
      }));

      const { error } = await supabaseClient.from("orders").insert(rows);
      if (error) throw error;

      const totalBase = items.reduce((s, i) => s + i.price * i.qty, 0);

      try {
        await emailjs.send(
          SITE_CONFIG.emailjs.serviceId,
          SITE_CONFIG.emailjs.templateId,
          {
            product_titles: items.map(i => `${i.title} x${i.qty}`).join(", "),
            total: formatPrice(totalBase),
            customer_pseudo: pseudo,
            customer_contact: whatsappDiscord,
            country: countryLabel,
            payment_method: payment,
            post_address: postAddress || "-"
          },
          { publicKey: SITE_CONFIG.emailjs.publicKey }
        );
      } catch (emailErr) {
        console.error("EmailJS error:", emailErr);
      }

      Cart.clear();
      msg.textContent = msgs.success[lang];
      msg.classList.add("show", "success");

      // On propose toujours de finaliser/coordonner sur WhatsApp
      const paymentLabels = {
        robux: "Robux",
        poste: lang === "en" ? "Post office" : lang === "ar" ? "البريد" : "Par poste",
        ooredoo: lang === "en" ? "Ooredoo credit" : lang === "ar" ? "رصيد اوريدو" : "Recharge Ooredoo"
      };
      const text = encodeURIComponent(
        `AZ Store — ${items.map(i => i.title).join(", ")} — ${formatPrice(totalBase)}. ${I18n.t("countryLabel")}: ${countryLabel}. ${paymentLabels[payment] || payment}. ${pseudo}.`
      );
      setTimeout(() => window.open(`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=${text}`, "_blank"), 800);

      setTimeout(() => { window.location.href = "index.html"; }, 2500);
    } catch (err) {
      console.error(err);
      msg.textContent = msgs.error[lang];
      msg.classList.add("show", "error");
      btn.disabled = false;
      btn.textContent = I18n.t("confirmOrder");
    }
  });

  renderCheckoutItems();
</script>
</body>
</html>
