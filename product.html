<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objet — AZ Store</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="AZ Store" class="logo">
      <span class="brand-name">AZ<span>Store</span></span>
    </a>
    <div class="nav-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Rechercher..." onclick="window.location.href='index.html'" readonly>
    </div>
    <nav class="nav-links">
      <a href="index.html" data-i18n="navShop">Boutique</a>
      <select id="currencySelect" class="select-mini" aria-label="Devise">
        <option value="eur">EUR €</option>
        <option value="usd">USD $</option>
        <option value="dt">DT</option>
        <option value="sar">SAR</option>
      </select>
      <select id="langSelect" class="select-mini" aria-label="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
      <span id="navAuthSlot"></span>
    </nav>
    <button class="icon-btn" id="cartToggle" aria-label="Ouvrir le panier" title="Panier">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
      <span class="cart-count" id="cartCount" style="display:none;">0</span>
    </button>

    <button class="icon-btn nav-toggle" id="mobileNavToggle" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="nav-links-mobile" id="navLinksMobile">
    <a href="index.html" data-i18n="navShop">Boutique</a>
    <a href="checkout.html" data-i18n="navCart">Panier</a>
    <a href="login.html" data-i18n="navLogin">Se connecter</a>
    <select id="currencySelectMobile" class="select-mini" aria-label="Devise" style="margin-top:8px;">
      <option value="eur">EUR €</option>
      <option value="usd">USD $</option>
      <option value="dt">DT</option>
      <option value="sar">SAR</option>
    </select>
    <select id="langSelectMobile" class="select-mini" aria-label="Langue" style="margin-top:8px;">
      <option value="fr">FR</option>
      <option value="en">EN</option>
      <option value="ar">AR</option>
    </select>
  </div>
</header>

<div class="breadcrumb">
  <a href="index.html" data-i18n="breadcrumbShop">Boutique</a>
  <span>/</span>
  <span id="crumbTitle">…</span>
</div>

<div class="product-detail" id="productDetail">
  <!-- rempli par JS -->
</div>

<footer class="footer">
  <div class="footer-inner">
    <p data-i18n="footerCopy">&copy; 2026 AZ Store. Marketplace non affiliée à Roblox Corporation.</p>
    <div class="footer-links">
      <a href="login.html" data-i18n="navLogin">Connexion</a>
      <a href="register.html" data-i18n="createAccount">Inscription</a>
      <a href="checkout.html" data-i18n="navCart">Panier</a>
    </div>
  </div>
</footer>

<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 data-i18n="checkoutCartTitle">Ton panier</h3>
    <button class="cart-close" id="cartClose" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer" id="cartFooter" style="display:none;">
    <div class="cart-total-row">
      <span data-i18n="total">Total</span>
      <span class="amount" id="cartTotalAmount">0.00 €</span>
    </div>
    <a href="checkout.html" class="btn btn-primary btn-block" data-i18n="confirmOrder">Passer la commande</a>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/currency.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");
  let currentProduct = null;

  async function loadProduct() {
    const wrap = document.getElementById("productDetail");
    const lang = I18n.get();
    const notFoundMsg = lang === "en" ? "Item not found." : lang === "ar" ? "الغرض غير موجود." : "Objet introuvable.";
    const backLabel = I18n.t("breadcrumbShop");

    if (!productId) {
      wrap.innerHTML = `<p>${notFoundMsg} <a href="index.html" style="color:var(--green-neon)">${backLabel}</a></p>`;
      return;
    }
    const p = await Products.fetchOne(productId);
    if (!p) {
      wrap.innerHTML = `<p>${notFoundMsg} <a href="index.html" style="color:var(--green-neon)">${backLabel}</a></p>`;
      return;
    }
    currentProduct = p;
    document.title = `${p.title} — AZ Store`;
    document.getElementById("crumbTitle").textContent = p.title;

    const t = (key) => I18n.t(key);
    const robuxLabel = lang === "en" ? "Robux price" : lang === "ar" ? "سعر الروبوكس" : "Prix en Robux";

    wrap.innerHTML = `
      <div class="pd-visual ${p.img_class || 'grad-green'}">
        ${!p.in_stock ? `<span class="card-badge out" style="position:absolute; top:16px; left:16px; z-index:3;">${t("outOfStock")}</span>` : (p.badge ? `<span class="card-badge" style="position:absolute; top:16px; left:16px; z-index:3;">${escapeHtml(p.badge)}</span>` : "")}
        ${getIcon(p.icon)}
        ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(p.title)}" class="pd-img" loading="lazy" onerror="this.remove()">` : ""}
      </div>
      <div class="pd-info">
        <span class="card-category">${escapeHtml(p.category)} &middot; ${escapeHtml(p.game)}</span>
        <h1>${escapeHtml(p.title)}</h1>
        <div class="pd-price-row">
          <span class="now">${formatPrice(p.price)}</span>
          ${p.old_price ? `<span class="old">${formatPrice(p.old_price)}</span>` : ""}
        </div>
        ${p.robux_price ? `<div class="pd-robux-price" style="display:flex; align-items:center; gap:6px; margin-top:-8px; margin-bottom:16px; font-size:14px; color:var(--text-dim);">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="1.8"><path d="M12 2 2 8.5 12 15l10-6.5L12 2Z"/><path d="M2 15.5 12 22l10-6.5"/><path d="M2 12l10 6.5L22 12"/></svg>
          <span>${robuxLabel}: <strong>${Number(p.robux_price).toLocaleString(lang === "ar" ? "ar" : lang)} R$</strong></span>
        </div>` : ""}
        <p class="pd-desc">${escapeHtml(p.description || "—")}</p>
        <div class="pd-meta">
          <div class="pd-meta-item"><span class="label">${t("regionLabel")}</span><span class="val">${escapeHtml(p.region || "Global")}</span></div>
          <div class="pd-meta-item"><span class="label">${t("availabilityLabel")}</span><span class="val">${p.in_stock ? t("inStock") : t("outOfStock")}</span></div>
        </div>
        <div class="pd-actions">
          <button class="btn btn-primary" id="addToCartBtn" ${!p.in_stock ? "disabled" : ""}>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
            ${t("addToCart")}
          </button>
        </div>
      </div>
    `;

    document.getElementById("addToCartBtn")?.addEventListener("click", () => {
      Cart.add(p);
      showToast(I18n.get() === "en" ? "Added to cart" : I18n.get() === "ar" ? "أُضيف إلى السلة" : "Ajouté au panier");
    });
  }

  loadProduct();
  document.addEventListener("langchange", loadProduct);
</script>
</body>
</html>
