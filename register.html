<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — AZ Store</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="AZ Store" class="logo">
      <span class="brand-name">AZ<span>Store</span></span>
    </a>
    <nav class="nav-links" style="margin-left:auto;">
      <a href="index.html" data-i18n="navShop">Boutique</a>
      <select id="langSelect" class="select-mini" aria-label="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
    </nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1 data-i18n="registerTitle">Créer un compte</h1>
    <p class="sub" data-i18n="registerSub">Rejoins AZ Store en quelques secondes.</p>

    <div class="form-msg" id="formMsg"></div>

    <form id="registerForm">
      <div class="field">
        <label for="pseudo" data-i18n="pseudoLabel">Pseudo Roblox</label>
        <input type="text" id="pseudo" required placeholder="TonPseudoRoblox">
      </div>
      <div class="field">
        <label for="email" data-i18n="emailLabel">Adresse e-mail</label>
        <input type="email" id="email" required autocomplete="email" placeholder="toi@exemple.com">
      </div>
      <div class="field">
        <label for="password" data-i18n="passwordLabel">Mot de passe</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="6 caractères minimum">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="registerBtn">Créer mon compte</button>
    </form>

    <p class="auth-switch"><span data-i18n="haveAccount">Déjà un compte ?</span> <a href="login.html" data-i18n="signIn">Se connecter</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("formMsg");
    msg.className = "form-msg";
    const lang = I18n.get();

    const pseudo = document.getElementById("pseudo").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    btn.textContent = lang === "en" ? "Creating..." : lang === "ar" ? "جارٍ الإنشاء..." : "Création...";

    try {
      await Auth.register(email, password, pseudo);
      msg.textContent = lang === "en" ? "Account created. Redirecting..." : lang === "ar" ? "تم إنشاء الحساب. جارِ التحويل..." : "Compte créé avec succès. Redirection...";
      msg.classList.add("show", "success");
      setTimeout(() => { window.location.href = "index.html"; }, 700);
    } catch (err) {
      msg.textContent = Auth.translateError(err);
      msg.classList.add("show", "error");
      btn.disabled = false;
      btn.textContent = I18n.t("registerBtn");
    }
  });

  (async () => {
    const user = await Auth.getUser();
    if (user) window.location.href = "index.html";
  })();
</script>
</body>
</html>
